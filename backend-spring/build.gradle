plugins {
    id 'java'
    // 11-13 보안: 3.2.0(2023-11, 지원 끝, 알려진 취약점 있음) → 3.5 최신 패치. 3.x 안에서만 올림 (4.x 는 큰 변경이라 안 함)
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.farm'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom.annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'   // 로그인 세션·비밀번호 암호화(BCrypt) (11-10)
    implementation 'org.springframework.boot:spring-boot-starter-validation' // 요청 값 검사 @Valid (11-10)
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
}

test {
    useJUnitPlatform()
}
