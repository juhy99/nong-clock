spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/farmdb
    username: postgres
    password: ${DB_PASSWORD:1234}  # 환경변수 DB_PASSWORD 가 있으면 그 값 (저장소 .env 와 맞추기)
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # 이미 도커에서 테이블을 만들었으므로 validate나 none을 쓰는 것이 안전합니다.
    show-sql: true
    properties:
      hibernate:
        format_sql: true



# 시세 API 의 품종 목록(items50.json)이 있는 폴더. backend-spring 폴더에서 실행하면 ../shared, 도커는 SHARED_DIR=/app/shared
shared:
  dir: ${SHARED_DIR:../shared}

ml:
  api:
    url: http://localhost:8000  # FastAPI 서버 주소