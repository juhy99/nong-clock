# 로그인 세션 (11-10): 브라우저에는 세션 번호 쿠키만. 자바스크립트로 못 읽게(http-only), 다른 사이트에서 온 요청엔 안 붙게(same-site lax)
server:
  servlet:
    session:
      timeout: 12h          # 12시간 동안 아무 요청이 없으면 로그아웃
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}  # https 로 서비스하면 서버 .env 에 COOKIE_SECURE=true (http 에서 true 면 로그인이 안 됨)

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/farmdb
    username: postgres
    password: ${DB_PASSWORD:1234}  # 환경변수 DB_PASSWORD 가 있으면 그 값 (저장소 .env 와 맞추기)
    driver-class-name: org.postgresql.Driver

  # 서버가 켜질 때 표 만들기 (11-10): 이미 만든 DB 에 새 표(댓글 post_comment)가 없으면 만든다. 있으면 그대로 (IF NOT EXISTS)
  # JPA 표 검사(validate)보다 먼저 실행됨. 새 표를 추가할 때는 같은 방식으로 파일을 만들어 아래 목록에 더하기
  sql:
    init:
      mode: always
      schema-locations: classpath:db/post_comment.sql

  jpa:
    hibernate:
      ddl-auto: validate  # 이미 도커에서 테이블을 만들었으므로 validate나 none을 쓰는 것이 안전합니다.
    show-sql: false  # true 면 SQL 이 로그에 찍힘 (회원 이메일 등이 로그에 남지 않게 기본은 끔)
    properties:
      hibernate:
        format_sql: true



# 시세 API 의 품종 목록(items50.json)이 있는 폴더. backend-spring 폴더에서 실행하면 ../shared, 도커는 SHARED_DIR=/app/shared
shared:
  dir: ${SHARED_DIR:../shared}

ml:
  api:
    url: http://localhost:8000  # FastAPI 서버 주소