spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/farmdb
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # 이미 도커에서 테이블을 만들었으므로 validate나 none을 쓰는 것이 안전합니다.
    show-sql: true
    properties:
      hibernate:
        format_sql: true



ml:
  api:
    url: http://localhost:8000  # FastAPI 서버 주소