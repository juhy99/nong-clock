services:
  db:
    image: postgres:15-alpine
    container_name: nong-clock-db
    environment:
      POSTGRES_DB: farmdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data

  ml-api:
    build: ./ml-api
    container_name: nong-clock-ml-api
    environment:
      MODEL_VERSION: ${MODEL_VERSION:-dummy-0.1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      ENABLE_REGIONAL_FORECAST: ${ENABLE_REGIONAL_FORECAST:-false}
    ports:
      - "8000:8000"

volumes:
  pgdata: