services:
  db:
    image: postgres:15-alpine
    container_name: nong-clock-db
    environment:
      POSTGRES_DB: farmdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # 11-13 보안: DB 는 이 컴퓨터 안(127.0.0.1)에서만 열림 — 같은 와이파이의 다른 컴퓨터가 5432 로 들어오지 못하게.
    # 컨테이너끼리(backend · ml-api · 수집기)는 도커 내부망으로 그대로 됨. 다른 PC 에서 DB 에 꼭 붙어야 하면 서버 .env 에 DB_BIND=0.0.0.0 (끝나면 지우기)
    ports:
      - "${DB_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped  # 서버 컴퓨터를 다시 켜도 자동으로

  # 회원·게시판 백엔드 (backend-spring). 서버 .env 에 COMPOSE_PROFILES=spring 을 넣어야 켜진다 (deploy/README.md "회원 백엔드 켜기")
  # DB 주소·비밀번호는 여기서 덮어쓴다 (application.yml 은 각자 PC 용). 밖으로는 열지 않고 web 의 /api/ 로만
  backend:
    build: ./backend-spring
    container_name: nong-clock-backend
    # 11-14: 언제나 켬 (예전 profiles: ["spring"] — 회원·게시판·시세가 모두 backend 를 씀)
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/farmdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}   # https 서버면 .env 에 COOKIE_SECURE=true (로그인 쿠키를 https 에서만)
      TZ: Asia/Seoul   # 글·댓글 쓴 시간을 한국 시간으로 (없으면 컨테이너 기본 UTC 라 9시간 이르게 저장됨)
      ML_API_URL: http://ml-api:8000
      SHARED_DIR: /app/shared  # 시세 API 의 품종 목록 shared/items50.json
      DATA_GO_KR_KEY: ${DATA_GO_KR_KEY:-}  # 지금 날씨 /api/weather/regions (11-14) — 기상청 단기예보·특보 (공공데이터포털 키)
      UPDATER_URL: http://price-updater:8090   # 관리자 [지금 갱신] (11-17) → 아래 price-updater
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
    volumes:
      - ./shared:/app/shared:ro
    depends_on:
      - db
    restart: unless-stopped

  ml-api:
    build:  # 저장소 맨 위에서 빌드 (shared/ 의 품목·도매시장·흙 pH 목록이 필요)
      context: .
      dockerfile: ml-api/Dockerfile
    container_name: nong-clock-ml-api
    environment:
      MODEL_VERSION: ${MODEL_VERSION:-}   # 비우면 PREDICTOR=db 일 때 최종 모델 이름 (ml-api/app/core/config.py, 11-17)
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      ENABLE_REGIONAL_FORECAST: ${ENABLE_REGIONAL_FORECAST:-false}
      # 예측기: db(DB 실제 시세 + price_forecast_daily 일 단위 예측, 기본 11-13) · dummy(가짜)
      PREDICTOR: ${PREDICTOR:-db}
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: farmdb
      PGUSER: postgres
      PGPASSWORD: ${DB_PASSWORD}
    # 11-13 보안: ml-api 도 이 컴퓨터 안에서만. 밖에서는 nginx 의 /ml/ (요청 수 제한이 걸린 길)로만. 직접 열어야 하면 ML_BIND=0.0.0.0
    ports:
      - "${ML_BIND:-127.0.0.1}:8000:8000"
    depends_on:
      - db
    restart: unless-stopped

  # 농업 뉴스 수집기: 켜자마자 한 번, 그 뒤 1시간마다 수집 → 볼륨 newsdata (collector/news/README.md)
  news-collector:
    build:
      context: .
      dockerfile: collector/news/Dockerfile
    container_name: nong-clock-news-collector
    environment:
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
    volumes:
      - newsdata:/app/collector/news/data
    restart: unless-stopped

  # 날씨 수집기 + 통합 전처리 (데이터 담당 코드, collector/weather/README.md): 예보 3시간마다, 관측·전처리 매일 10:40
  # 원본·결과 → 볼륨 weatherraw. 키는 서버 .env 의 KMA_APIHUB_KEY(기상청 API허브) · DATA_GO_KR_KEY(공공데이터포털)
  weather-collector:
    build:
      context: .
      dockerfile: collector/weather/Dockerfile
    container_name: nong-clock-weather-collector
    init: true  # 멈출 때 돌고 있던 수집도 같이 정리
    environment:
      KMA_APIHUB_KEY: ${KMA_APIHUB_KEY:-}
      DATA_GO_KR_KEY: ${DATA_GO_KR_KEY:-}
    volumes:
      - weatherraw:/app/collector/weather/data
    restart: unless-stopped

  # 날씨 화면 파일: 수집기가 만든 날씨_대통합_일별.csv (또는 손으로 넣은 collector/weather_site/input/*.csv)를
  # 5분마다 확인해 바뀌면 화면용 JSON 으로 다시 만들고, 수집 기록도 복사 → 볼륨 weatherdata (collector/weather_site/README.md)
  weather-export:
    build:
      context: .
      dockerfile: collector/weather_site/Dockerfile
    container_name: nong-clock-weather-export
    environment:
      WEATHER_CSV: /weather/site/날씨_대통합_일별.csv
      WEATHER_LOG_DIR: /weather
    volumes:
      - weatherraw:/weather:ro
      - ./collector/weather_site/input:/app/collector/weather_site/input:ro
      - weatherdata:/app/collector/weather_site/data
    restart: unless-stopped

  # 갱신 서비스 (11-17, collector/updater/README.md): 관리자 화면 [지금 갱신]·[월 예측 만들기]·[PDF 올리기] 를 받아
  # 가격 수집 → 표 → DB → 예측을 컨테이너 안에서 돌린다 (예전에는 scripts\매일_예측_갱신.bat 을 손으로)
  # 밖으로 열지 않음(expose 만) — backend 만 부르고, 그때도 UPDATER_TOKEN 이 맞아야 함. 토큰이 비면 모든 요청 거절
  # 자료 폴더: .env 의 NC_DATA_ROOT (예: D:\nong-clock-data). 자동 실행은 기본 꺼짐 — 켜려면 UPDATER_DAILY_AT=06:00
  price-updater:
    build:
      context: .
      dockerfile: collector/updater/Dockerfile
    container_name: nong-clock-price-updater
    init: true  # 멈출 때 돌고 있던 수집·예측도 같이 정리
    expose:
      - "8090"
    environment:
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
      UPDATER_DAILY_AT: ${UPDATER_DAILY_AT:-}
      NC_DATA_ROOT: /nong-clock-data
      FARMBID_DATA: /nong-clock-data/05_DB적재/data
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: farmdb
      PGUSER: postgres
      PGPASSWORD: ${DB_PASSWORD}
      # 수집 인증키 (collector/daily/키_발급_따라하기.md). 없는 키의 자료는 건너뛰고 받은 자료로 계속
      MAFRA_API_KEY: ${MAFRA_API_KEY:-}
      KAMIS_KEY: ${KAMIS_KEY:-}
      KAMIS_ID: ${KAMIS_ID:-}
      KMA_APIHUB_KEY: ${KMA_APIHUB_KEY:-}
      DATA_GO_KR_KEY: ${DATA_GO_KR_KEY:-}
      KOSIS_API_KEY: ${KOSIS_API_KEY:-}
      ECOS_API_KEY: ${ECOS_API_KEY:-}
      SEOUL_OPENAPI_KEY: ${SEOUL_OPENAPI_KEY:-}
      TZ: Asia/Seoul
    volumes:
      - ${NC_DATA_ROOT:-./nong-clock-data}:/nong-clock-data
    depends_on:
      - db
    restart: unless-stopped

  # 서버 화면: http://서버주소 (사용자) · /admin/ (관리자) · /api/ (회원 백엔드) · /ml/ (ML API) · /data/ (수집한 뉴스) · /data/weather/ (날씨)
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:  # 배포 버전 (deploy/deploy.ps1 이 채움, 관리자 화면에 표시). 회원·게시판은 언제나 backend (11-14, AUTH_MODE 없앰)
        VITE_PRICE_SOURCE: ${PRICE_SOURCE:-db}  # 시세: db(Spring /api/prices… 가 DB 를 읽음, 기본 11-13) · mock(가짜)
        VITE_ENABLE_AUCTION: ${ENABLE_AUCTION:-false}
        BUILD_SHA: ${BUILD_SHA:-}
        BUILD_MSG: ${BUILD_MSG:-}
        BUILD_TIME: ${BUILD_TIME:-}
    container_name: nong-clock-web
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - newsdata:/srv/news:ro
      - weatherdata:/srv/weather:ro
    depends_on:
      - ml-api
    restart: unless-stopped

volumes:
  pgdata:
  newsdata:
  weatherraw:
  weatherdata: