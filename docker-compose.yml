services:
  db:
    image: postgres:15-alpine
    container_name: nong-clock-db
    environment:
      POSTGRES_DB: farmdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped  # 서버 컴퓨터를 다시 켜도 자동으로

  # 회원·게시판 백엔드 (backend-spring). 서버 .env 에 COMPOSE_PROFILES=spring 을 넣어야 켜진다 (deploy/README.md "회원 백엔드 켜기")
  # DB 주소·비밀번호는 여기서 덮어쓴다 (application.yml 은 각자 PC 용). 밖으로는 열지 않고 web 의 /api/ 로만
  backend:
    build: ./backend-spring
    container_name: nong-clock-backend
    profiles: ["spring"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/farmdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}   # https 서버면 .env 에 COOKIE_SECURE=true (로그인 쿠키를 https 에서만)
      TZ: Asia/Seoul   # 글·댓글 쓴 시간을 한국 시간으로 (없으면 컨테이너 기본 UTC 라 9시간 이르게 저장됨)
      ML_API_URL: http://ml-api:8000
      SHARED_DIR: /app/shared  # 시세 API 의 품종 목록 shared/items50.json
    volumes:
      - ./shared:/app/shared:ro
    depends_on:
      - db
    restart: unless-stopped

  ml-api:
    build:  # 저장소 맨 위에서 빌드 (shared/ 의 품목·도매시장·흙 pH 목록이 필요)
      context: .
      dockerfile: ml-api/Dockerfile
    container_name: nong-clock-ml-api
    environment:
      MODEL_VERSION: ${MODEL_VERSION:-dummy-0.1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      ENABLE_REGIONAL_FORECAST: ${ENABLE_REGIONAL_FORECAST:-false}
      # 예측기 (11-11): dummy(가짜, 기본) · db(DB 실제 시세 + price_forecast_monthly 월 예측). 내 PC 시험 bat 은 db 로 켬
      PREDICTOR: ${PREDICTOR:-dummy}
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: farmdb
      PGUSER: postgres
      PGPASSWORD: ${DB_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped

  # 농업 뉴스 수집기: 켜자마자 한 번, 그 뒤 1시간마다 수집 → 볼륨 newsdata (collector/news/README.md)
  news-collector:
    build:
      context: .
      dockerfile: collector/news/Dockerfile
    container_name: nong-clock-news-collector
    environment:
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
    volumes:
      - newsdata:/app/collector/news/data
    restart: unless-stopped

  # 날씨 수집기 + 통합 전처리 (데이터 담당 코드, collector/weather/README.md): 예보 3시간마다, 관측·전처리 매일 10:40
  # 원본·결과 → 볼륨 weatherraw. 키는 서버 .env 의 KMA_APIHUB_KEY(기상청 API허브) · DATA_GO_KR_KEY(공공데이터포털)
  weather-collector:
    build:
      context: .
      dockerfile: collector/weather/Dockerfile
    container_name: nong-clock-weather-collector
    init: true  # 멈출 때 돌고 있던 수집도 같이 정리
    environment:
      KMA_APIHUB_KEY: ${KMA_APIHUB_KEY:-}
      DATA_GO_KR_KEY: ${DATA_GO_KR_KEY:-}
    volumes:
      - weatherraw:/app/collector/weather/data
    restart: unless-stopped

  # 날씨 화면 파일: 수집기가 만든 날씨_대통합_일별.csv (또는 손으로 넣은 collector/weather_site/input/*.csv)를
  # 5분마다 확인해 바뀌면 화면용 JSON 으로 다시 만들고, 수집 기록도 복사 → 볼륨 weatherdata (collector/weather_site/README.md)
  weather-export:
    build:
      context: .
      dockerfile: collector/weather_site/Dockerfile
    container_name: nong-clock-weather-export
    environment:
      WEATHER_CSV: /weather/site/날씨_대통합_일별.csv
      WEATHER_LOG_DIR: /weather
    volumes:
      - weatherraw:/weather:ro
      - ./collector/weather_site/input:/app/collector/weather_site/input:ro
      - weatherdata:/app/collector/weather_site/data
    restart: unless-stopped

  # 서버 화면: http://서버주소 (사용자) · /admin/ (관리자) · /api/ (회원 백엔드) · /ml/ (ML API) · /data/ (수집한 뉴스) · /data/weather/ (날씨)
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:  # 배포 버전 (deploy/deploy.ps1 이 채움, 관리자 화면에 표시) · 회원 기능 mock/spring (서버 .env 의 AUTH_MODE)
        VITE_AUTH: ${AUTH_MODE:-mock}
        VITE_PRICE_SOURCE: ${PRICE_SOURCE:-mock}  # 시세: mock(가짜) · db(Spring /api/prices… 가 DB 를 읽음)
        VITE_ENABLE_AUCTION: ${ENABLE_AUCTION:-false}
        BUILD_SHA: ${BUILD_SHA:-}
        BUILD_MSG: ${BUILD_MSG:-}
        BUILD_TIME: ${BUILD_TIME:-}
    container_name: nong-clock-web
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - newsdata:/srv/news:ro
      - weatherdata:/srv/weather:ro
    depends_on:
      - ml-api
    restart: unless-stopped

volumes:
  pgdata:
  newsdata:
  weatherraw:
  weatherdata: