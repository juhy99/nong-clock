# 서버 화면(web 컨테이너). 사용자 사이트 /, 관리자 사이트 /admin/, ML API /ml/, 수집한 뉴스 /data/
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # 수집기가 쌓은 뉴스 파일 (news-recent.json 최근 7일 · news.json 90일 · collect_log.json 수집 기록 · rejected.json 거른 기사)
    # 내 PC 의 npm run dev 에서도 읽을 수 있게 다른 주소 허용 (공개 뉴스라 괜찮음)
    location /data/ {
        alias /srv/news/;
        default_type application/json;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    # ML API (같은 주소로 부르므로 CORS 불필요). ml-api 가 꺼져 있어도 nginx 는 뜨도록 요청 때 이름을 찾는다
    location /ml/ {
        resolver 127.0.0.11 valid=30s;
        set $ml http://ml-api:8000;
        rewrite ^/ml/(.*)$ /$1 break;
        proxy_pass $ml;
    }

    # 빌드 파일은 이름에 해시가 붙어 있어 오래 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /admin/reports 처럼 안쪽 주소로 바로 들어와도 관리자 화면, 나머지는 사용자 화면
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
