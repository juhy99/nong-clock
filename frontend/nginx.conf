# 서버 화면(web 컨테이너). 사용자 사이트 /, 관리자 사이트 /admin/, 회원 백엔드 /api/, ML API /ml/, 수집한 뉴스 /data/, 날씨 /data/weather/

# ── 요청 수 제한 (11-13 보안): 한 IP(접속한 컴퓨터)가 짧은 시간에 너무 많이 보내면 429 로 돌려보낸다 ──
# 평소 사용자는 걸리지 않을 넉넉한 값. burst = 순간적으로 몰려도 봐주는 개수
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;     # /api 전체: 1초에 20번
limit_req_zone $binary_remote_addr zone=ml:10m rate=10r/s;      # AI 예측: 1초에 10번 (DB 를 많이 읽음)
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;    # 로그인·가입: 1분에 10번 (비밀번호 마구 넣어 보기 막기)
map $request_method $write_ip { GET ""; HEAD ""; OPTIONS ""; default $binary_remote_addr; }  # 읽기는 빈 값 = 제한 안 함
limit_req_zone $write_ip zone=write:10m rate=30r/m;             # 글·댓글 쓰기·고치기·지우기: 1분에 30번 (도배 막기)
limit_conn_zone $binary_remote_addr zone=conn:10m;              # 한 IP 가 동시에 여는 연결 수
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    root /usr/share/nginx/html;

    server_tokens off;            # 오류 화면에 nginx 버전을 보이지 않음
    client_max_body_size 1m;      # 요청 본문 최대 1MB (글 내용 2만 자도 넉넉함). 사진 업로드를 만들면 그 주소만 늘림
    limit_conn conn 30;           # 한 IP 동시 연결 30개까지

    # 보안 헤더: 브라우저에게 "이 사이트를 다른 사이트 안(iframe)에 넣지 마라 · 파일 종류를 추측하지 마라 · 다른 사이트로 갈 때 주소 전체를 넘기지 마라"
    # (아래 location 에서 add_header 를 쓰면 여기 값이 사라지므로 그 location 에도 같은 4줄을 둔다)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # 수집기가 쌓은 뉴스 파일 (news-recent.json 최근 7일 · news.json 90일 · collect_log.json 수집 기록 · rejected.json 거른 기사)
    # 내 PC 의 npm run dev 에서도 읽을 수 있게 다른 주소 허용 (공개 뉴스라 괜찮음)
    location /data/ {
        alias /srv/news/;
        default_type application/json;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # 날씨 화면 파일 (weather-export 가 만듦: regions-daily.json · regions-monthly.json · meta.json). /data/ 보다 먼저 맞는다 (더 긴 주소)
    location /data/weather/ {
        alias /srv/weather/;
        default_type application/json;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # ML API (같은 주소로 부르므로 CORS 불필요). ml-api 가 꺼져 있어도 nginx 는 뜨도록 요청 때 이름을 찾는다
    location /ml/ {
        resolver 127.0.0.11 valid=30s;
        set $ml http://ml-api:8000;
        rewrite ^/ml/(.*)$ /$1 break;
        proxy_pass $ml;
        limit_req zone=ml burst=60 nodelay;   # 예측 화면은 시장 여러 곳(최대 32곳)을 한 번에 부름 → burst 넉넉히
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;               # 급등락 품목(50품목 계산)도 이 안에
    }

    # 회원·게시판 백엔드 (backend-spring, 같은 주소라 CORS 불필요). 주소는 그대로 넘긴다 (/api/auth/login → backend:8080/api/auth/login)
    # backend 는 서버 .env 에서 켜기 전까지 없다 → 그동안 502. ml-api 와 같이 요청 때 이름을 찾아 nginx 는 뜬다
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $http_host;  # 포트까지 그대로 (Spring 이 같은 사이트로 보고 CORS 로 막지 않게)
        proxy_set_header X-Forwarded-For $remote_addr;  # 접속한 IP 하나로 덮어씀 (브라우저가 보낸 가짜 X-Forwarded-For 는 버림 → Spring 요청 제한이 속지 않음)
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=api burst=60 nodelay;
        limit_req zone=write burst=10 nodelay;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 로그인·가입·중복 확인은 따로 더 좁게 (위 /api/ 설정 + 1분에 10번)
    location ~ ^/api/auth/(login|signup|check)$ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=auth burst=5 nodelay;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 빌드 파일은 이름에 해시가 붙어 있어 오래 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # /admin/reports 처럼 안쪽 주소로 바로 들어와도 관리자 화면, 나머지는 사용자 화면
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
