# 서버 화면(web 컨테이너). 사용자 사이트 /, 관리자 사이트 /admin/, 회원 백엔드 /api/, ML API /ml/, 수집한 뉴스 /data/, 날씨 /data/weather/
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # 수집기가 쌓은 뉴스 파일 (news-recent.json 최근 7일 · news.json 90일 · collect_log.json 수집 기록 · rejected.json 거른 기사)
    # 내 PC 의 npm run dev 에서도 읽을 수 있게 다른 주소 허용 (공개 뉴스라 괜찮음)
    location /data/ {
        alias /srv/news/;
        default_type application/json;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    # 날씨 화면 파일 (weather-export 가 만듦: regions-daily.json · regions-monthly.json · meta.json). /data/ 보다 먼저 맞는다 (더 긴 주소)
    location /data/weather/ {
        alias /srv/weather/;
        default_type application/json;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    # ML API (같은 주소로 부르므로 CORS 불필요). ml-api 가 꺼져 있어도 nginx 는 뜨도록 요청 때 이름을 찾는다
    location /ml/ {
        resolver 127.0.0.11 valid=30s;
        set $ml http://ml-api:8000;
        rewrite ^/ml/(.*)$ /$1 break;
        proxy_pass $ml;
    }

    # 회원·게시판 백엔드 (backend-spring, 같은 주소라 CORS 불필요). 주소는 그대로 넘긴다 (/api/auth/login → backend:8080/api/auth/login)
    # backend 는 서버 .env 에서 켜기 전까지 없다 → 그동안 502. ml-api 와 같이 요청 때 이름을 찾아 nginx 는 뜬다
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $http_host;  # 포트까지 그대로 (Spring 이 같은 사이트로 보고 CORS 로 막지 않게)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 빌드 파일은 이름에 해시가 붙어 있어 오래 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /admin/reports 처럼 안쪽 주소로 바로 들어와도 관리자 화면, 나머지는 사용자 화면
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
